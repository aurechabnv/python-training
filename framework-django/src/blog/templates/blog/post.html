{% extends 'blog/base.html' %}

{% block title %}<title>{{ blogpost.title }}</title>{% endblock %}

{% block content %}
    <a href="{% url 'blog-index' %}">Retour au sommaire</a>
    <a href="{% url 'blog-post-edit' slug=blogpost.slug %}">Modifier l'article</a>
    <a href="{% url 'blog-post-delete' slug=blogpost.slug %}">Supprimer l'article</a>

    <h1>{{ blogpost.title }}</h1>
    <h2>{{ blogpost.word_count }} mots</h2>
    <p>{{ blogpost.content|safe }}</p>
{% endblock %}
