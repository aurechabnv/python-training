{% extends 'blog/base.html' %}

{% block title %}<title>{{ blog_post.title }}</title>{% endblock %}

{% block content %}
    <a href="{% url 'blog-index' %}">Retour au sommaire</a>
    <h1>{{ blog_post.title }}</h1>
    <h2>{{ blog_post.number_of_words }} mots</h2>
    <p>{{ blog_post.content|safe }}</p>
{% endblock %}
